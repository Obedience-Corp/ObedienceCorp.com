name: Sync public releases

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/releases.yml"
      - "scripts/sync-releases.mjs"
      - "src/lib/releases.mjs"

permissions:
  contents: read

concurrency:
  group: public-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Discover repositories and import all published releases
        run: npm run releases:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- src/data/releases.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build && npm test && npm run test:sync
      - name: Publish validated snapshot
        id: publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/releases.json
          git commit -m 'content: sync public organization releases'
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.sync.outputs.revision }}
